[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bridgeai-agent"
version = "0.2.0"
description = "Engineering skeleton for BridgeAI-Agent bridge and road inspection AI Agent."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
backend = [
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "uvicorn[standard]>=0.30",
]
dev = [
  "httpx2>=2.9",
  "pytest>=7.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "postgres: requires the guarded bridgeai_agent_test PostgreSQL database",
]

[tool.setuptools.packages.find]
include = ["agent*", "backend*", "tools*"]
exclude = ["docs*", "examples*", "frontend*", "tests*"]
